<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FashionAIble – QR poster (A4)</title>
  <style>
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #FFFFFF; color: #141414; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .poster {
      width: 210mm;
      height: 297mm;
      padding: 30mm 25mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      page-break-after: avoid;
      overflow: hidden;
    }
    .qr { width: 130mm; height: 130mm; display: block; }
    .line { font-size: 26pt; font-weight: 500; margin: 14mm 0 0; line-height: 1.25; }
    @media screen {
      body { background: #EEEEEC; }
      .poster { background: #FFFFFF; margin: 16px auto; }
    }
  </style>
</head>
<body>
  <main class="poster">
    <img class="qr" src="qr.png" alt="QR code for https://fashionaible.github.io/fashionaible-app/" width="1024" height="1024">
    <p class="line">Scan to get FashionAIble</p>
  </main>
</body>
</html>
